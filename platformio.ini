; PlatformIO Project Configuration File

[platformio]
default_envs = esp32s3

[env:esp32s3]
platform = espressif32 @ ~6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags =
	-DCORE_DEBUG_LEVEL=1
	-I include
	-I src
lib_deps =
	mikalhart/TinyGPSPlus @ ^1.0.3
	adafruit/Adafruit ADS1X15 @ ^2.5.0
	adafruit/Adafruit BusIO @ ^1.16.1
	milesburton/DallasTemperature @ ^3.11.0
	paulstoffregen/OneWire @ ^2.3.8
	greiman/SdFat @ ^2.2.3

[env:native]
platform = native
test_framework = unity
test_build_src = true
; Pure-C++ unit tests only — exclude Arduino / FreeRTOS modules.
build_src_filter =
	+<*>
	-<sensors/>
	-<actuators/>
	-<detection/>
	-<comms/>
	-<storage/>
	-<main.cpp>
	-<control/HeadingController.cpp>
	-<core/Tasks.cpp>
	-<safety/Watchdog.cpp>
build_flags =
	-std=gnu++17
	-DUSV_NATIVE_TEST
	-I include
	-I src
